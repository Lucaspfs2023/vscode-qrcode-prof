name: qrcode_prof
description: Aplicativo de leitura e correção de cartões-resposta.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  mobile_scanner: ^7.5.0
  path_provider: ^2.1.6
  pdf: ^3.10.8
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/roboto-regular.ttf
    - assets/fonts/roboto-bold.ttf
